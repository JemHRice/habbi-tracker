name: Backend

# Tests gate the deploy: the image is never built, let alone released, unless
# the whole suite passes on both SQLite and Postgres.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/habbi-tracker-api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit
          POSTGRES_DB: habit_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habit -d habit_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test against SQLite
        run: pytest

      - name: Test against Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://habit:habit@localhost:5432/habit_tracker
        run: pytest

  # `secrets` is not available in a job-level `if`, so readiness is computed
  # here and passed down as an output. Before Azure is provisioned the deploy
  # job simply skips instead of failing the build.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Azure secrets not set yet — skipping deploy. See docs/RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [test, configured]
    if: github.ref == 'refs/heads/main' && needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write # required for OIDC federation with Azure

    steps:
      - uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Rolling out a new revision restarts the container, whose entrypoint
      # applies any outstanding Alembic migrations before serving. The seed is
      # never run here — it is a one-time step, so a deploy cannot duplicate a
      # board.
      - name: Release new revision
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP || 'habbitracker-api' }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP || 'habbi-tracker' }}" \
              --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --output none

      - name: Wait for health
        run: |
          URL="${{ vars.API_BASE_URL }}"
          if [ -z "$URL" ]; then
            echo "API_BASE_URL variable not set; skipping health check."
            exit 0
          fi
          for attempt in $(seq 1 20); do
            if curl -fsS "$URL/health" >/dev/null; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 6
          done
          echo "API did not report healthy in time." >&2
          exit 1
